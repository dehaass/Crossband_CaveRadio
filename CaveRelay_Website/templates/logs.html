<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cave Relay / System Logs</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <div>
      <p class="eyebrow">QDX / SURFACE STATION</p>
      <h1>System logs</h1>
    </div>
    <div class="topbar-actions"><a class="page-link" href="{{ url_for('index') }}">Operations</a><div class="live-status"><span class="status-dot good"></span><div><span>LOG MONITOR</span><small id="last-checked">Last checked: --</small></div></div></div>
  </header>

  <main class="shell log-viewer-shell">
    <section class="panel log-panel">
      <div class="panel-head"><div><p class="eyebrow">PERSISTED JSONL</p><h2>Application activity</h2></div><div class="panel-status"><span class="table-count" id="log-count">0 records</span><button class="icon-button" id="refresh-button" title="Refresh system logs" aria-label="Refresh system logs">↻</button></div></div>
      <div class="log-clock-bar"><span class="eyebrow">System time</span><span class="live-clock" id="live-clock">--:--:--</span></div>
      <div class="table-tools log-viewer-tools">
        <input id="log-search" type="search" placeholder="Search log messages">
        <div class="log-level-filters" id="log-level-filters">
          <label><input type="checkbox" value="DEBUG" checked>Debug</label>
          <label><input type="checkbox" value="INFO" checked>Info</label>
          <label><input type="checkbox" value="WARNING" checked>Warning</label>
          <label><input type="checkbox" value="ERROR" checked>Error</label>
          <label><input type="checkbox" value="CRITICAL" checked>Critical</label>
        </div>
        <select id="log-source"><option value="">All sources</option></select>
        <select id="log-since">
          <option value="">All time</option>
          <option value="300000">Last 5 min</option>
          <option value="600000">Last 10 min</option>
          <option value="1800000">Last 30 min</option>
          <option value="3600000">Last 1 hr</option>
          <option value="21600000">Last 6 hr</option>
          <option value="86400000">Last 24 hr</option>
        </select>
      </div>
      <div class="log-table-wrap log-viewer-table"><table><thead><tr><th>Timestamp</th><th>Level</th><th>Source</th><th>Message</th></tr></thead><tbody id="log-body"><tr><td colspan="4" class="empty">Loading system logs...</td></tr></tbody></table></div>
    </section>
  </main>
  <script src="{{ url_for('static', filename='logs.js') }}"></script>
</body>
</html>
